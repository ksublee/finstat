<script>
(() => {
  const sidebar = document.querySelector("#quarto-sidebar ul.sidebar-menu");
  if (!sidebar) return;

  const conceptLink = Array.from(sidebar.querySelectorAll("a.sidebar-link")).find((link) => {
    const href = link.getAttribute("href") || "";
    return /(?:^|\/)concepts\/index\.html$/.test(href);
  });
  if (!conceptLink) return;

  const conceptItem = conceptLink.closest("li.sidebar-item");
  if (!conceptItem || conceptItem.classList.contains("concept-sidebar-parent")) return;

  const categoryNames = new Set(["확률", "통계", "금융", "참고"]);
  const categoryItems = [];
  let current = conceptItem.nextElementSibling;

  while (current) {
    const label = current.querySelector(".menu-text")?.textContent.trim();
    if (!categoryNames.has(label)) break;

    const next = current.nextElementSibling;
    categoryItems.push(current);
    current = next;
  }
  if (categoryItems.length === 0) return;

  const sectionId = "quarto-sidebar-concepts";
  const nestedList = document.createElement("ul");
  nestedList.id = sectionId;
  nestedList.className = "collapse list-unstyled sidebar-section depth1 show";
  categoryItems.forEach((item) => nestedList.appendChild(item));

  conceptItem.classList.add("sidebar-item-section", "concept-sidebar-parent");
  conceptItem.appendChild(nestedList);

  const container = conceptItem.querySelector(":scope > .sidebar-item-container");
  if (!container) return;

  const toggle = document.createElement("a");
  toggle.className = "sidebar-item-toggle text-start";
  toggle.setAttribute("data-bs-toggle", "collapse");
  toggle.setAttribute("data-bs-target", `#${sectionId}`);
  toggle.setAttribute("role", "navigation");
  toggle.setAttribute("aria-expanded", "true");
  toggle.setAttribute("aria-label", "개념 설명 하위 목차 접기 또는 펼치기");
  toggle.innerHTML = '<i class="bi bi-chevron-right ms-2"></i>';
  container.appendChild(toggle);
})();
</script>
